<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Pool Room — звук ролика</title>
  <!-- Офлайн-рендер звука «Пролёта»: открывает video/render.mjs --audio. -->
</head>
<body>
<script type="module">
  import { DURATION } from './shot.js';
  import { soundCues, mulberry32 } from './cues.js';
  import { renderSoundtrack } from './soundtrack.js';

  // 16-битный стерео WAV из AudioBuffer.
  function wav(buffer) {
    const ch = [buffer.getChannelData(0), buffer.getChannelData(1)];
    const n = ch[0].length;
    const out = new DataView(new ArrayBuffer(44 + n * 4));
    const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
    str(0, 'RIFF');
    out.setUint32(4, 36 + n * 4, true);
    str(8, 'WAVEfmt ');
    out.setUint32(16, 16, true);
    out.setUint16(20, 1, true);
    out.setUint16(22, 2, true);
    out.setUint32(24, buffer.sampleRate, true);
    out.setUint32(28, buffer.sampleRate * 4, true);
    out.setUint16(32, 4, true);
    out.setUint16(34, 16, true);
    str(36, 'data');
    out.setUint32(40, n * 4, true);
    for (let i = 0, o = 44; i < n; i++) {
      for (const c of ch) {
        out.setInt16(o, Math.max(-1, Math.min(1, c[i])) * 0x7fff, true);
        o += 2;
      }
    }
    return out.buffer;
  }

  window.renderAudio = async () => {
    // Звук ролика — свой (video/soundtrack.js), не игровой; случайности повторяемые.
    const rate = 48000;
    const ctx = new OfflineAudioContext(2, Math.ceil(rate * DURATION), rate);
    const buffer = await renderSoundtrack(ctx, soundCues(), mulberry32(7), DURATION);
    const bytes = new Uint8Array(wav(buffer));
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  };
  window.audioReady = true;
</script>
</body>
</html>
