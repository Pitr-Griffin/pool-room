<!DOCTYPE html>
<html lang="ru" data-composition-variables="[{&quot;id&quot;:&quot;name&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Название&quot;,&quot;default&quot;:&quot;Pool Room&quot;},{&quot;id&quot;:&quot;line&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Строка описания&quot;,&quot;default&quot;:&quot;Две комнаты, коридор и вода. Выхода нет.&quot;}]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Палитра и стекло — как у панели интерактивной версии (index.html проекта). */
      :root {
        --ground: #000;
        --ink: #ffffff;
        --glass-bg: rgba(46, 62, 78, 0.32);
        --glass-border: rgba(255, 255, 255, 0.38);
        --font-display: Inter, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      #scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: contain; z-index: 1; }
      #title { position: absolute; inset: 0; z-index: 3; }
      #title-card {
        position: absolute; left: 50%; bottom: 150px; margin-left: -430px; width: 860px;
        padding: 34px 48px 36px; text-align: center; color: var(--ink);
        background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 22px;
        box-shadow: 0 8px 32px rgba(20, 40, 60, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(16px) saturate(140%);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
      #title-name { font-size: 76px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
      #title-line { margin-top: 18px; font-size: 30px; font-weight: 400; opacity: 0.9; }




      #fade { position: absolute; inset: 0; z-index: 5; }
      #fade-black { position: absolute; inset: 0; background: #000; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-vnw1" id="root" data-composition-id="main" data-start="0" data-duration="50" data-width="1920" data-height="1080">
      <video data-hf-id="hf-i7w2" id="scene" class="clip" src="assets/scene.mp4" data-start="0" data-duration="50" data-track-index="0" muted playsinline></video>
      <audio data-hf-id="hf-c27j" id="sound" class="clip" src="assets/sound.wav" data-start="0" data-duration="50" data-track-index="1" data-volume="1"></audio>

      <div data-hf-id="hf-y23u" id="title" class="clip" data-start="4.9" data-duration="4.9" data-track-index="2">
        <div data-hf-id="hf-9yp0" id="title-card">
          <div data-hf-id="hf-qwa6" id="title-name" data-var-text="name">Pool Room</div>
          <div data-hf-id="hf-xx4e" id="title-line" data-var-text="line">Две комнаты, коридор и вода. Выхода нет.</div>
        </div>
      </div>


      <div data-hf-id="hf-y5ry" id="fade" class="clip" data-start="47" data-duration="3" data-track-index="4">
        <div data-hf-id="hf-bmrh" id="fade-black"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Титр: въезжает снизу и проявляется на 5 с, держится, уходит к 9.6 с.
      tl.fromTo('#title-card', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: 'power3.out' }, 5);
      tl.to('#title-card', { y: -16, opacity: 0, duration: 0.6, ease: 'power2.in' }, 9);
      // Затемнение в чёрное 47 → 49.5 с.
      tl.fromTo('#fade-black', { opacity: 0 }, { opacity: 1, duration: 2.5, ease: 'power1.in' }, 47);
tl.to("#scene", { keyframes: { "0%": { x: 0, y: 0 }, "100%": { x: 3, y: 3, ease: "custom(M0,0 C0.333,0 0.667,1 1,1)" }, easeEach: "none" }, duration: 0.633 }, 0);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
